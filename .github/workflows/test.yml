name: Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l *.go)"
      - run: go test -race ./...
      - run: go vet ./...
